<figure class="post-artwork rust-inspection" data-rust-inspection>
  <img class="rust-inspection-still" src="{{ (.Resources.Get "cover.webp").RelPermalink }}"
    width="1536" height="1024"
    alt="An artisan inspecting a hairline crack in a forged iron ring with a fine metal pick.">
  <div class="rust-inspection-layers" aria-hidden="true">
    <img class="rust-inspection-base" src="{{ (.Resources.Get "cover-base.webp").RelPermalink }}"
      width="1536" height="1024" alt="" draggable="false">
    {{ $crack := resources.Get "images/covers/rust-std-memory-safety/crack.svg" }}
    {{ $crack.Content | safeHTML }}
    {{ range slice "head" "hand" }}
    <img class="rust-inspection-{{ . }}"
      src="{{ ($.Resources.Get (printf "cover-%s.webp" .)).RelPermalink }}"
      width="1536" height="1024" alt="" draggable="false">
    {{ end }}
  </div>
</figure>
{{ $motion := resources.Get "js/rust-inspection.js" | minify | fingerprint }}
<script src="{{ $motion.RelPermalink }}" integrity="{{ $motion.Data.Integrity }}" defer></script>
