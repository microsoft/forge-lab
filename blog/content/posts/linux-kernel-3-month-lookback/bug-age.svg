<svg xmlns="http://www.w3.org/2000/svg" width="560" height="334" viewBox="0 0 560 334" role="img" aria-labelledby="age-title age-description">
  <title id="age-title">Age of reported kernel bugs</title>
  <desc id="age-description">Across the 59 public reports, the average age at first report was 8.1 years and the median was 5.6 years. Some bugs were present for at least 21 years. There were two bugs younger than one year, six aged one to under three years, fifteen aged three to under five years, twenty-two aged five to under ten years, five aged ten to under fifteen years, six aged fifteen to under twenty years, and three aged twenty years or older. Ages use the introducing commits named by the reports' Fixes tags; three initial Git-import tags give lower bounds.</desc>
  <g font-family="system-ui, sans-serif" fill="#292b28">
    <text x="20" y="31" font-size="24" font-weight="650">Age of the reported bugs</text>
    <text x="20" y="58" font-size="17" fill="#65665e">Mean 8.1 years | median 5.6 | oldest 21+ years</text>

    <g font-size="18">
      <text x="20" y="104">Under 1 year</text>
      <text x="20" y="138">1 to under 3</text>
      <text x="20" y="172">3 to under 5</text>
      <text x="20" y="206">5 to under 10</text>
      <text x="20" y="240">10 to under 15</text>
      <text x="20" y="274">15 to under 20</text>
      <text x="20" y="308">20+ years</text>
    </g>
    <path d="M170 82V319" stroke="#bdb9ac" stroke-width="1"/>
    <g fill="#b9927f">
      <rect x="170" y="86" width="24" height="24" rx="3" data-count="2"/>
      <rect x="170" y="120" width="72" height="24" rx="3" data-count="6"/>
      <rect x="170" y="154" width="180" height="24" rx="3" data-count="15"/>
      <rect x="170" y="188" width="264" height="24" rx="3" data-count="22" fill="#98482e"/>
      <rect x="170" y="222" width="60" height="24" rx="3" data-count="5"/>
      <rect x="170" y="256" width="72" height="24" rx="3" data-count="6"/>
      <rect x="170" y="290" width="36" height="24" rx="3" data-count="3"/>
    </g>
    <g font-size="18" font-weight="600">
      <text x="204" y="104">2</text>
      <text x="252" y="138">6</text>
      <text x="360" y="172">15</text>
      <text x="444" y="206">22</text>
      <text x="240" y="240">5</text>
      <text x="252" y="274">6</text>
      <text x="216" y="308">3</text>
    </g>
  </g>
</svg>
