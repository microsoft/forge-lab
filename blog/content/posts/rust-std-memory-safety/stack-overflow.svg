<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 562" role="img" aria-labelledby="title desc">
  <title id="title">How Rust reports a stack overflow, and what the bug unmaps</title>
  <desc id="desc">One column of memory, higher addresses at the top. The main thread's stack is read/write; its frames, main followed by repeated recurse calls, grow down until the next frame lands in the guard page below, which has no access. Touching the guard page raises SIGSEGV, which invokes Rust's signal handler, registered with sigaction. Further down in memory is the alternate signal stack, a read/write mapping above its own guard page, and the handler runs on it. In the bug, process::exit called from a child thread unmaps the alternate signal stack while it is still registered.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 19px; font-weight: 600; fill: #292b28; }
      .sub { font-size: 16px; fill: #65665e; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .frame-text { font-size: 16px; fill: #292b28; }
      .bug { font-size: 16px; fill: #98482e; }
      .box { fill: #fbfaf7; stroke: #292b28; stroke-width: 1.5; }
      .frame { fill: #efece4; stroke: #292b28; stroke-width: 1; }
      .next-frame { fill: none; stroke: #292b28; stroke-width: 1.25; stroke-dasharray: 5 3; }
      .guard { fill: #e4e1d8; stroke: #292b28; stroke-width: 1.5; }
      .flow { stroke: #292b28; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Main thread stack: frames grow down until the next one lands in the guard page -->
  <rect class="box" x="60" y="40" width="220" height="222" rx="6"/>
  <text class="title" x="170" y="64" text-anchor="middle">Main thread stack</text>
  <text class="sub" x="170" y="86" text-anchor="middle">read/write</text>
  <rect class="frame" x="72" y="96" width="196" height="28"/>
  <text class="frame-text mono" x="170" y="116" text-anchor="middle">main()</text>
  <rect class="frame" x="72" y="124" width="196" height="28"/>
  <text class="frame-text mono" x="170" y="144" text-anchor="middle">recurse()</text>
  <rect class="frame" x="72" y="152" width="196" height="28"/>
  <text class="frame-text mono" x="170" y="172" text-anchor="middle">recurse()</text>
  <rect class="frame" x="72" y="180" width="196" height="28"/>
  <text class="frame-text mono" x="170" y="200" text-anchor="middle">recurse()</text>
  <rect class="frame" x="72" y="208" width="196" height="28"/>
  <text class="frame-text mono" x="170" y="228" text-anchor="middle">recurse()</text>
  <rect class="frame" x="72" y="236" width="196" height="26"/>
  <text class="frame-text mono" x="170" y="255" text-anchor="middle">recurse()</text>
  <rect class="guard" x="60" y="262" width="220" height="74" rx="6"/>
  <rect class="next-frame" x="72" y="262" width="196" height="24"/>
  <text class="sub mono" x="170" y="280" text-anchor="middle">recurse()</text>
  <text class="title" x="170" y="310" text-anchor="middle">Guard page</text>
  <text class="sub" x="170" y="329" text-anchor="middle">no access</text>

  <!-- Growth direction -->
  <g fill="#292b28">
    <line class="flow" x1="40" y1="100" x2="40" y2="276"/>
    <path d="M34,276 L46,276 L40,286 z"/>
  </g>
  <text class="sub" transform="translate(28 193) rotate(-90)" text-anchor="middle">stack grows down</text>

  <!-- The access to the guard page raises SIGSEGV, which invokes the handler -->
  <g fill="#292b28">
    <circle cx="268" cy="274" r="4"/>
    <line class="flow" x1="268" y1="274" x2="345" y2="274"/>
    <path d="M345,268 L345,280 L355,274 z"/>
  </g>
  <text class="sub mono" x="312" y="264" text-anchor="middle">SIGSEGV</text>
  <rect class="box" x="355" y="240" width="240" height="68" rx="6"/>
  <text class="title" x="475" y="269" text-anchor="middle">Rust's signal handler</text>
  <text class="sub" x="475" y="293" text-anchor="middle">registered with <tspan class="mono">sigaction</tspan></text>

  <!-- Gap in the address space -->
  <text class="sub" x="170" y="364" text-anchor="middle">other mappings</text>

  <!-- Alternate signal stack; the dashed outline marks what the bug unmaps -->
  <rect x="51" y="385" width="238" height="166" rx="10" fill="#98482e" fill-opacity="0.06" stroke="#98482e" stroke-width="1.75" stroke-dasharray="6 4"/>
  <rect class="box" x="60" y="394" width="220" height="92" rx="6"/>
  <text class="title" x="170" y="422" text-anchor="middle">Alternate stack</text>
  <text class="sub" x="170" y="444" text-anchor="middle">for signal handlers</text>
  <text class="sub" x="170" y="466" text-anchor="middle">read/write</text>
  <rect class="guard" x="60" y="486" width="220" height="56" rx="6"/>
  <text class="title" x="170" y="512" text-anchor="middle">Guard page</text>
  <text class="sub" x="170" y="532" text-anchor="middle">no access</text>

  <!-- The handler runs on the alternate stack -->
  <g fill="#292b28">
    <path class="flow" d="M475,308 V440 H300"/>
    <path d="M300,434 L300,446 L290,440 z"/>
  </g>
  <text class="sub" x="483" y="380">runs on</text>

  <text class="bug" x="445" y="494" text-anchor="middle">The bug: <tspan class="mono">process::exit</tspan> in a</text>
  <text class="bug" x="445" y="516" text-anchor="middle">child thread unmaps this</text>
  <text class="bug" x="445" y="538" text-anchor="middle">while it is still registered</text>
</svg>
